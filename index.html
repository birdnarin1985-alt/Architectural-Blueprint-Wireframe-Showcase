<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya v9.0 - Smart Camera Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1a1a1a; color: #e5e5e5; overflow: hidden; margin: 0; }
        
        /* กระดาษสเก็ตช์ที่ขยายเต็มจอเสมอ */
        #viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f7f6f0;
            background-image: radial-gradient(#d6cfbc 1px, transparent 1px);
            background-size: 24px 24px;
        }

        canvas { 
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <!-- HUD ข้อมูลระบบ -->
        <div class="hud-overlay text-zinc-800">
            <h1 class="text-xl font-bold text-amber-600">⚙️ Bodhi-Panya: Smart Camera</h1>
            <p class="text-xs font-bold font-mono">Auto-Fit Bounding Box Algorithm</p>
            <div id="debug-info" class="text-[10px] text-zinc-500 mt-2"></div>
        </div>

        <canvas id="engineCanvas"></canvas>
        
        <div class="absolute bottom-4 right-4 text-xs font-bold text-amber-700">
            สัมปติจฉามิ
        </div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        const debugInfo = document.getElementById('debug-info');

        class Vector3 {
            constructor(x, y, z) {
                this.x = x; this.y = y; this.z = z;
            }
        }

        // =========================================================
        // 📷 ระบบกล้องอัจฉริยะ (Smart Camera System)
        // =========================================================
        let camera = { scale: 1, offsetX: 0, offsetY: 0 };

        // 1. แปลง 3D เป็น 2D ดิบๆ (ยังไม่คูณสเกลจอ)
        function getRaw2D(vec3) {
            const angle = Math.PI / 6; // Isometric 30 องศา
            const x2d = (vec3.x - vec3.z) * Math.cos(angle);
            const y2d = vec3.y + (vec3.x + vec3.z) * Math.sin(angle);
            return { x: x2d, y: -y2d };
        }

        // 2. แปลงพิกัดดิบ เข้าสู่พิกัดกล้องหน้าจอจริง
        function project(vec3) {
            const raw = getRaw2D(vec3);
            return {
                x: (raw.x * camera.scale) + camera.offsetX,
                y: (raw.y * camera.scale) + camera.offsetY
            };
        }

        // 3. อัลกอริทึมหาขนาดและจัดกลางอัตโนมัติ (Auto-Fit)
        function calculateAutoCamera(vertices) {
            if (vertices.length === 0) return;

            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            // หาจุดขอบสุดของโมเดลทั้งหมด
            vertices.forEach(v => {
                const raw = getRaw2D(v);
                if (raw.x < minX) minX = raw.x;
                if (raw.x > maxX) maxX = raw.x;
                if (raw.y < minY) minY = raw.y;
                if (raw.y > maxY) maxY = raw.y;
            });

            const modelWidth = maxX - minX;
            const modelHeight = maxY - minY;

            // คำนวณ Scale ให้พอดีกับ Canvas พร้อมเว้นขอบ (Padding 20%)
            const padding = 0.8; 
            const scaleX = (canvas.width * padding) / modelWidth;
            const scaleY = (canvas.height * padding) / modelHeight;
            
            // เลือก Scale ที่เล็กที่สุด เพื่อไม่ให้ล้นจอ
            camera.scale = Math.min(scaleX, scaleY);

            // คำนวณ Offset เพื่อดันภาพไปอยู่ตรงกลางจอเป๊ะๆ
            const modelCenterX = (minX + maxX) / 2;
            const modelCenterY = (minY + maxY) / 2;
            
            camera.offsetX = (canvas.width / 2) - (modelCenterX * camera.scale);
            camera.offsetY = (canvas.height / 2) - (modelCenterY * camera.scale);

            // แสดงค่า Debug บนหน้าจอ
            debugInfo.innerHTML = `Screen: ${canvas.width}x${canvas.height}<br>Scale: ${camera.scale.toFixed(2)}`;
        }

        // =========================================================
        // ✒️ ฟังก์ชันลายเส้นสถาปนิก (Procedural Sketch) คงเดิม
        // =========================================================
        function drawArchitectLine(p1, p2, isBold = false) {
            ctx.beginPath();
            
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            // ลดความตวัดลงนิดหน่อยให้ดูเป็นระเบียบขึ้นเมื่อย่อขนาด
            const overX = (dx / length) * (Math.random() * 6 + 3); 
            const overY = (dy / length) * (Math.random() * 6 + 3);

            const startX = p1.x - (overX * 0.5);
            const startY = p1.y - (overY * 0.5);
            const endX = p2.x + overX;
            const endY = p2.y + overY;

            ctx.moveTo(startX, startY);

            const segments = 10;
            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const currentX = startX + (endX - startX) * t;
                const currentY = startY + (endY - startY) * t;
                
                const jitterX = currentX + (Math.random() - 0.5) * 1.0;
                const jitterY = currentY + (Math.random() - 0.5) * 1.0;
                
                ctx.lineTo(jitterX, jitterY);
            }

            ctx.strokeStyle = isBold ? '#1f1f1f' : '#666666';
            ctx.lineWidth = isBold ? 1.5 : 0.8;
            ctx.stroke();
        }

        // =========================================================
        // 🚀 รันระบบ
        // =========================================================
        let foundationNodes = [];

        function initScene() {
            // ปรับขนาด Canvas ให้เท่ากับหน้าจอจริงแบบ Responsive
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const width = 120;
            const depth = 200;
            const height = 20;

            // รวบรวมจุด 3D ทั้งหมดเข้า Array เพื่อให้กล้องคำนวณ
            foundationNodes = [
                new Vector3(-width, 0, -depth),
                new Vector3(width, 0, -depth),
                new Vector3(width, 0, depth),
                new Vector3(-width, 0, depth),
                new Vector3(-width, height, -depth),
                new Vector3(width, height, -depth),
                new Vector3(width, height, depth),
                new Vector3(-width, height, depth)
            ];

            // ให้กล้องคำนวณขนาดที่พอดีจอก่อนวาด
            calculateAutoCamera(foundationNodes);
            renderScene();
        }

        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const [p1, p2, p3, p4, t1, t2, t3, t4] = foundationNodes.map(v => project(v));

            // วาดฐานราก
            drawArchitectLine(p1, t1, true);
            drawArchitectLine(p2, t2, true);
            drawArchitectLine(p3, t3, true);
            drawArchitectLine(p4, t4, true);

            drawArchitectLine(p1, p2, false);
            drawArchitectLine(p2, p3, false);
            drawArchitectLine(p3, p4, false);
            drawArchitectLine(p4, p1, false);

            drawArchitectLine(t1, t2, true);
            drawArchitectLine(t2, t3, true);
            drawArchitectLine(t3, t4, true);
            drawArchitectLine(t4, t1, true);
        }

        // เมื่อหมุนจอ หรือเปลี่ยนขนาดหน้าจอ ให้รันกล้องใหม่
        window.addEventListener('resize', initScene);
        
        // รันครั้งแรก
        initScene();
    </script>
</body>
</html>
