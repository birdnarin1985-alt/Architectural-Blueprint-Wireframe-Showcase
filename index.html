<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิหารแก้ว วัดท่าซุง - Architectural Ink Sketchbook</title>
    
    <!-- 🧬 BODHI-PANYA ENGINE v9.0: INK SKETCHBOOK EDITION -->
    <meta name="engine-dna" content="Bodhi-Panya v9.0 Architectural Ink Sketchbook">
    <meta name="author" content="ช่างเบิร์ด (Chang Bird)">
    <meta name="mantra" content="สัมปติจฉามิ">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1a1a1a; color: #111; }
        
        /* สมุดสเก็ตช์สีขาวครีม */
        .sketchbook-page {
            background-color: #fdfcf7;
            background-image: radial-gradient(#e5e2d6 0.8px, transparent 0.8px);
            background-size: 20px 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 0 100px rgba(229, 226, 214, 0.5);
        }

        /* ลายเส้นหมึกซึมเข้มขลังสไตล์สถาปนิก */
        .ink-line {
            stroke: #1a1a1a;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ink-line-fine {
            stroke: #404040;
            stroke-width: 0.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ink-hatch {
            stroke: #525252;
            stroke-width: 0.6;
            stroke-linecap: round;
        }

        .architect-text {
            fill: #262626;
            font-family: 'Sarabun', sans-serif;
            font-size: 11px;
            font-weight: 600;
        }

        /* สันห่วงสมุดสปริงด้านบน */
        .spiral-binding {
            display: flex;
            justify-content: space-around;
            width: 90%;
            margin: 0 auto;
            position: absolute;
            top: -14px;
            left: 5%;
            z-index: 20;
        }
        .spiral-ring {
            width: 14px;
            height: 28px;
            background: linear-gradient(135deg, #71717a 0%, #27272a 50%, #d4d4d8 100%);
            border-radius: 7px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>

    <script>
        console.log("✒️ [Bodhi-Panya v9.0]: Ink Sketchbook Mode Loaded");
        function showBodhiPanyaDNA() {
            alert(`✒️ Bodhi-Panya Engine v9.0 Sketchbook:\n\n` +
                  `🏛️ วิหารแก้ว วัดท่าซุง (Architectural Ink Sketch)\n` +
                  `👨‍💻 พัฒนาโดย: ช่างเบิร์ด (Chang Bird)\n` +
                  `🙏 น้อมรำลึกในพระคุณหลวงพ่อฤาษีลิงดำ\n` +
                  `✨ สัมปติจฉามิ... ลุยงานกันต่อยาวๆ ครับ!`);
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center border-b border-zinc-800 pb-4 mb-4 text-white">
        <div>
            <span class="text-[10px] tracking-widest text-amber-500 uppercase font-semibold">Architectural Freehand Ink Sketch</span>
            <h1 class="text-xl font-bold">วิหารแก้ว วัดท่าซุง — สมุดสเก็ตช์สถาปนิก</h1>
        </div>
        <button onclick="showBodhiPanyaDNA()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold px-3 py-2 rounded-lg shadow transition">
            ✒️ Bodhi-Panya v9.0
        </button>
    </header>

    <!-- Main Viewport -->
    <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col items-center justify-center relative py-6">
        
        <!-- สมุดสเก็ตช์หลัก -->
        <div class="sketchbook-page w-full max-w-3xl rounded-xl border border-zinc-300 p-8 md:p-12 relative overflow-visible mt-4">
            
            <!-- สันห่วงสปริงด้านบน (จำลองเหมือนในรูป) -->
            <div class="spiral-binding">
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
            </div>

            <!-- ปากกาหมึกซึมพาดตกแต่งด้านบนสมุด -->
            <div class="absolute -top-7 right-12 z-30 transform rotate-12 hidden md:block pointer-events-none">
                <div class="bg-zinc-900 text-amber-400 px-4 py-1.5 rounded-full text-[10px] font-bold shadow-lg border border-zinc-700 flex items-center gap-1.5">
                    <span>✒️ ARCACHITECT PEN</span>
                </div>
            </div>

            <!-- SVG Architectural Ink Sketch (วิหารแก้ว วัดท่าซุง & ฉัตร 7 ชั้น) -->
            <svg viewBox="0 0 800 480" class="w-full h-auto mt-4">
                
                <!-- ธรรมชาติ / เส้นขอบฟ้าสไตล์ฟรีแฮนด์ -->
                <path d="M 50 400 Q 200 395 400 398 T 750 400" class="ink-line-fine" />
                <path d="M 100 398 Q 120 380 140 398" class="ink-line-fine" />
                <path d="M 620 397 Q 640 375 660 397" class="ink-line-fine" />

                <!-- ฐานวิหารแก้ว -->
                <path d="M 150 360 L 650 360 L 700 400 L 100 400 Z" class="ink-line" />
                <line x1="100" y1="400" x2="150" y2="360" class="ink-line" />
                <line x1="700" y1="400" x2="650" y2="360" class="ink-line" />
                <!-- แรเงาฐาน -->
                <line x1="120" y1="400" x2="140" y2="360" class="ink-hatch" />
                <line x1="140" y1="400" x2="160" y2="360" class="ink-hatch" />

                <!-- ตัวอาคารวิหารแก้วและเสาบีม -->
                <path d="M 180 360 L 180 200 L 620 200 L 620 360" class="ink-line" />
                <!-- เสาโครงสร้างบีม -->
                <line x1="250" y1="200" x2="250" y2="360" class="ink-line-fine" />
                <line x1="320" y1="200" x2="320" y2="360" class="ink-line-fine" />
                <line x1="390" y1="200" x2="390" y2="360" class="ink-line-fine" />
                <line x1="460" y1="200" x2="460" y2="360" class="ink-line-fine" />
                <line x1="530" y1="200" x2="530" y2="360" class="ink-line-fine" />

                <!-- แรเงาใต้หลังคา (Cross-hatching) -->
                <line x1="190" y1="210" x2="210" y2="200" class="ink-hatch" />
                <line x1="210" y1="210" x2="230" y2="200" class="ink-hatch" />
                <line x1="590" y1="210" x2="610" y2="200" class="ink-hatch" />
                <line x1="600" y1="210" x2="620" y2="200" class="ink-hatch" />

                <!-- หน้าต่างทรงโค้งและกระจกแก้ว -->
                <path d="M 270 250 Q 285 220 300 250 L 300 320 L 270 320 Z" class="ink-line-fine" />
                <path d="M 340 250 Q 355 220 370 250 L 370 320 L 340 320 Z" class="ink-line-fine" />
                <path d="M 410 250 Q 425 220 440 250 L 440 320 L 410 320 Z" class="ink-line-fine" />
                <path d="M 480 250 Q 495 220 510 250 L 510 320 L 480 320 Z" class="ink-line-fine" />

                <!-- หลังคาทรงไทยซ้อนชั้นพริ้วไหวสไตล์ฟรีแฮนด์ -->
                <path d="M 120 200 L 400 110 L 680 200 Z" class="ink-line" />
                <path d="M 150 160 L 400 75 L 650 160 Z" class="ink-line" />
                <path d="M 180 120 L 400 45 L 620 120 Z" class="ink-line" />

                <!-- ยอดฉัตร 7 ชั้น (Seven-Tiered Chattra) ละเอียดคมชัด -->
                <line x1="400" y1="45" x2="400" y2="10" class="ink-line" />
                <line x1="388" y1="15" x2="412" y2="15" class="ink-line" />
                <line x1="391" y1="20" x2="409" y2="20" class="ink-line" />
                <line x1="388" y1="25" x2="412" y2="25" class="ink-line" />
                <line x1="391" y1="30" x2="409" y2="30" class="ink-line" />
                <line x1="388" y1="35" x2="412" y2="35" class="ink-line" />
                <line x1="391" y1="40" x2="409" y2="40" class="ink-line" />
                <circle cx="400" cy="7" r="2.5" fill="#1a1a1a" />

                <!-- ลายมือสถาปนิกเขียนกำกับแบบในรูป (Architect Handwriting) -->
                <text x="60" y="50" class="architect-text" style="font-style: italic;">MAIN ENTRANCE - GLASS CATHEDRAL 100M</text>
                <text x="60" y="65" class="architect-text" style="font-style: italic;">Scg. By Chang Bird (Bodhi-Panya v9.0 Engine)</text>

                <!-- ลายมือภาษาไทยมุมขวาล่างแบบสมุดสเก็ตช์ -->
                <text x="530" y="445" class="architect-text" style="font-size: 13px; font-weight: 700;">วิหารแก้ว 100 เมตร วัดท่าซุง</text>
                <text x="530" y="462" class="architect-text" style="font-style: italic;">น้อมบูชาหลวงพ่อฤาษีลิงดำ | สัมปติจฉามิ</text>
            </svg>

        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-zinc-400 pt-4">
        <span>หจก. เชียงใหม่ 63 การช่าง & Bodhi-Panya v9.0 Engine — ลุยงานต่อไม่มีพัก สัมปติจฉามิ! 🚀</span>
    </footer>

</body>
</html>
