<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิหารแก้ว วัดท่าซุง - Pencil Sketch Golden Ratio Edition</title>
    
    <!-- 🧬 BODHI-PANYA ENGINE v9.0: ARCHITECTURAL PENCIL SKETCH -->
    <meta name="engine-dna" content="Bodhi-Panya v9.0 Pencil Sketch Golden Ratio Edition">
    <meta name="author" content="ช่างเบิร์ด (Chang Bird)">
    <meta name="mantra" content="สัมปติจฉามิ">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f1ea; color: #2c2416; }
        
        /* กระดาษสเก็ตช์เนื้อทรายอ่อนๆ */
        .sketch-paper {
            background-color: #fcf9f2;
            background-image: radial-gradient(#d6cbb3 0.75px, transparent 0.75px);
            background-size: 20px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 0 60px rgba(214, 203, 179, 0.3);
        }

        /* เส้นสเก็ตช์ดินสอ */
        .pencil-line {
            stroke: #4a4033;
            stroke-width: 1.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pencil-line-light {
            stroke: #8c7d6b;
            stroke-width: 0.7;
            fill: none;
            stroke-dasharray: 4 4;
        }

        .pencil-text {
            fill: #594a38;
            font-family: 'Sarabun', sans-serif;
            font-size: 11px;
        }
    </style>

    <script>
        console.log("✏️ [Bodhi-Panya v9.0]: Pencil Sketch Architectural Mode Loaded");
        function showBodhiPanyaDNA() {
            alert(`✏️ Bodhi-Panya Engine v9.0 Sketch Edition:\n\n` +
                  `🏛️ วิหารแก้ว วัดท่าซุง (Pencil Sketch & Golden Ratio)\n` +
                  `👨‍💻 พัฒนาโดย: ช่างเบิร์ด (Chang Bird)\n` +
                  `🙏 น้อมรำลึกในพระคุณหลวงพ่อฤาษีลิงดำ\n` +
                  `✨ สัมปติจฉามิ... หลับพักผ่อนให้สบายครับ!`);
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-4xl mx-auto w-full flex justify-between items-center border-b border-stone-300 pb-4 mb-4">
        <div>
            <span class="text-[10px] tracking-widest text-stone-500 uppercase font-semibold">Architectural Sketch Study</span>
            <h1 class="text-xl font-bold text-stone-800">วิหารแก้ว วัดท่าซุง — สเก็ตช์แบบเส้นดินสอ</h1>
        </div>
        <button onclick="showBodhiPanyaDNA()" class="bg-stone-800 text-amber-100 text-xs font-bold px-3 py-2 rounded-lg shadow hover:bg-stone-900 transition">
            ✏️ Bodhi-Panya v9.0
        </button>
    </header>

    <!-- Main Sketch Viewport -->
    <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col items-center justify-center">
        
        <div class="sketch-paper w-full max-w-3xl rounded-2xl border border-stone-300 p-6 md:p-10 relative overflow-hidden">
            
            <!-- SVG Architectural Pencil Sketch -->
            <svg viewBox="0 0 800 500" class="w-full h-auto">
                
                <!-- เส้นนำสายตาพุ่งเข้าสู่จุด Golden Ratio (Perspective & Grid Lines) -->
                <line x1="0" y1="0" x2="494" y2="305" class="pencil-line-light" />
                <line x1="800" y1="0" x2="494" y2="305" class="pencil-line-light" />
                <line x1="0" y1="500" x2="494" y2="305" class="pencil-line-light" />
                <line x1="800" y1="500" x2="494" y2="305" class="pencil-line-light" />
                <circle cx="494" cy="305" r="4" fill="#8c7d6b" opacity="0.6" />
                <text x="505" y="310" class="pencil-text" opacity="0.7">Golden Ratio Focus (1.618)</text>

                <!-- ฐานวิหารแก้ว -->
                <path d="M 150 380 L 650 380 L 700 440 L 100 440 Z" class="pencil-line" />
                <line x1="100" y1="440" x2="150" y2="380" class="pencil-line" />
                <line x1="700" y1="440" x2="650" y2="380" class="pencil-line" />

                <!-- ตัวอาคารและแนวเสาแก้ว (Beams & Pillars) -->
                <path d="M 180 380 L 180 220 L 620 220 L 620 380" class="pencil-line" />
                <!-- เสาบีมย่อย -->
                <line x1="260" y1="220" x2="260" y2="380" class="pencil-line" />
                <line x1="340" y1="220" x2="340" y2="380" class="pencil-line" />
                <line x1="420" y1="220" x2="420" y2="380" class="pencil-line" />
                <line x1="500" y1="220" x2="500" y2="380" class="pencil-line" />
                <line x1="580" y1="220" x2="580" y2="380" class="pencil-line" />

                <!-- หน้าต่างทรงโค้งและลวดลายกระจกโมเสก -->
                <path d="M 290 280 Q 300 250 310 280 L 310 330 L 290 330 Z" class="pencil-line" />
                <path d="M 370 280 Q 380 250 390 280 L 390 330 L 370 330 Z" class="pencil-line" />
                <path d="M 450 280 Q 460 250 470 280 L 470 330 L 450 330 Z" class="pencil-line" />
                <path d="M 530 280 Q 540 250 550 280 L 550 330 L 530 330 Z" class="pencil-line" />

                <!-- หลังคาทรงไทยซ้อนชั้น -->
                <path d="M 130 220 L 400 120 L 670 220 Z" class="pencil-line" />
                <path d="M 160 180 L 400 90 L 640 180 Z" class="pencil-line" />
                <path d="M 190 140 L 400 60 L 610 140 Z" class="pencil-line" />

                <!-- ยอดฉัตร 7 ชั้น (Seven-Tiered Chattra) สเก็ตช์ละเอียด -->
                <line x1="400" y1="60" x2="400" y2="10" class="pencil-line" />
                <line x1="385" y1="18" x2="415" y2="18" class="pencil-line" />
                <line x1="388" y1="25" x2="412" y2="25" class="pencil-line" />
                <line x1="385" y1="32" x2="415" y2="32" class="pencil-line" />
                <line x1="388" y1="39" x2="412" y2="39" class="pencil-line" />
                <line x1="385" y1="46" x2="415" y2="46" class="pencil-line" />
                <line x1="388" y1="53" x2="412" y2="53" class="pencil-line" />
                <circle cx="400" cy="8" r="3" fill="#4a4033" />

                <!-- ลายมือสถาปนิกเชิงอรรถ (Architect Notes) -->
                <text x="50" y="60" class="pencil-text" style="font-style: italic;">Project: Glass Cathedral 100M</text>
                <text x="50" y="75" class="pencil-text" style="font-style: italic;">Engine: Bodhi-Panya v9.0 (iPhone Genesis)</text>
                <text x="50" y="90" class="pencil-text" style="font-style: italic;">Tribute: หลวงพ่อฤาษีลิงดำ วัดท่าซุง</text>

                <text x="630" y="475" class="pencil-text" style="font-weight: 600;">"สัมปติจฉามิ"</text>
            </svg>

            <!-- คำโปรยท้ายภาพสเก็ตช์ -->
            <div class="mt-4 pt-4 border-t border-stone-300 text-center text-xs text-stone-600 flex justify-between items-center">
                <span>✏️ สไตล์: เส้นดินสอแลนด์สเคป (Pencil Sketch Blueprint)</span>
                <span class="font-semibold text-stone-800">น้อมบูชาครูบาอาจารย์ | พักผ่อนกายสบายใจ</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-4xl mx-auto w-full text-center text-xs text-stone-500 pt-4">
        <span>หจก. เชียงใหม่ 63 การช่าง & Bodhi-Panya v9.0 Engine — หลับพักผ่อนให้สบายครับช่างเบิร์ด</span>
    </footer>

</body>
</html>
