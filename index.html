<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิหารแก้ว วัดท่าซุง - Wide Angle Pencil Sketch</title>
    
    <!-- 🧬 BODHI-PANYA ENGINE v9.0: WIDE ANGLE SKETCH EDITION -->
    <meta name="engine-dna" content="Bodhi-Panya v9.0 Wide Angle Pencil Sketch">
    <meta name="author" content="ช่างเบิร์ด (Chang Bird)">
    <meta name="mantra" content="สัมปติจฉามิ">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f2efe9; color: #2c2416; }
        
        .sketch-paper {
            background-color: #fcf9f2;
            background-image: radial-gradient(#d6cbb3 0.8px, transparent 0.8px);
            background-size: 24px 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1), inset 0 0 80px rgba(214, 203, 179, 0.25);
        }

        .pencil-line {
            stroke: #42372a;
            stroke-width: 1.1;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .pencil-line-dash {
            stroke: #8c7d6b;
            stroke-width: 0.8;
            fill: none;
            stroke-dasharray: 5 5;
        }

        .pencil-text {
            fill: #594a38;
            font-family: 'Sarabun', sans-serif;
            font-size: 10px;
        }
    </style>

    <script>
        console.log("📐 [Bodhi-Panya v9.0]: Wide Angle Sketch Mode Loaded");
        function showBodhiPanyaDNA() {
            alert(`📐 Bodhi-Panya Engine v9.0 Wide Angle Sketch:\n\n` +
                  `🏛️ วิหารแก้ว วัดท่าซุง (Wide Angle & Dashed Guide Lines)\n` +
                  `👨‍💻 พัฒนาโดย: ช่างเบิร์ด (Chang Bird)\n` +
                  `🙏 น้อมรำลึกในพระคุณหลวงพ่อฤาษีลิงดำ\n` +
                  `✨ สัมปติจฉามิ... หลับพักผ่อนให้สบายครับ!`);
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-5xl mx-auto w-full flex justify-between items-center border-b border-stone-300 pb-4 mb-4">
        <div>
            <span class="text-[10px] tracking-widest text-stone-500 uppercase font-semibold">Wide Angle Landscape Blueprint</span>
            <h1 class="text-xl font-bold text-stone-800">วิหารแก้ว วัดท่าซุง — มุมกว้าง (Wide Angle Sketch)</h1>
        </div>
        <button onclick="showBodhiPanyaDNA()" class="bg-stone-800 text-amber-100 text-xs font-bold px-3 py-2 rounded-lg shadow hover:bg-stone-900 transition">
            📐 Bodhi-Panya v9.0
        </button>
    </header>

    <!-- Main Sketch Viewport -->
    <main class="max-w-5xl mx-auto w-full flex-1 flex flex-col items-center justify-center">
        
        <div class="sketch-paper w-full max-w-4xl rounded-2xl border border-stone-300 p-6 md:p-8 relative overflow-hidden">
            
            <!-- SVG Wide Angle Architectural Sketch -->
            <svg viewBox="0 0 1000 500" class="w-full h-auto">
                
                <!-- เส้นประนำสายตา (Dashed Guide Lines) พุ่งเข้าสู่จุดโฟกัสตามสัดส่วนทองคำ -->
                <line x1="0" y1="0" x2="618" y2="309" class="pencil-line-dash" />
                <line x1="1000" y1="0" x2="618" y2="309" class="pencil-line-dash" />
                <line x1="0" y1="500" x2="618" y2="309" class="pencil-line-dash" />
                <line x1="1000" y1="500" x2="618" y2="309" class="pencil-line-dash" />
                <line x1="500" y1="0" x2="618" y2="309" class="pencil-line-dash" />
                
                <!-- จุดโฟกัส Golden Ratio Focus -->
                <circle cx="618" cy="309" r="3.5" fill="#8c7d6b" opacity="0.7" />
                <text x="630" y="313" class="pencil-text" opacity="0.7">Golden Ratio Focus (1.618)</text>

                <!-- ฐานวิหารแก้วมุมกว้าง (Wide Landscape Base) -->
                <path d="M 80 420 L 920 420 L 960 470 L 40 470 Z" class="pencil-line" />
                <line x1="40" y1="470" x2="80" y2="420" class="pencil-line" />
                <line x1="920" y1="420" x2="960" y2="470" class="pencil-line" />

                <!-- ตัวอาคารวิหารแก้ว (โครงสร้างเสาบีมยาวแบบ Wide Angle) -->
                <path d="M 140 420 L 140 220 L 860 220 L 860 420" class="pencil-line" />
                
                <!-- เสาบีมโครงสร้าง (Beams) เรียงรายตามสัดส่วน -->
                <line x1="230" y1="220" x2="230" y2="420" class="pencil-line" />
                <line x1="320" y1="220" x2="320" y2="420" class="pencil-line" />
                <line x1="410" y1="220" x2="410" y2="420" class="pencil-line" />
                <line x1="500" y1="220" x2="500" y2="420" class="pencil-line" />
                <line x1="590" y1="220" x2="590" y2="420" class="pencil-line" />
                <line x1="680" y1="220" x2="680" y2="420" class="pencil-line" />
                <line x1="770" y1="220" x2="770" y2="420" class="pencil-line" />

                <!-- หน้าต่างกระจกโมเสกและช่องแสง -->
                <path d="M 265 280 Q 275 250 285 280 L 285 360 L 265 360 Z" class="pencil-line" />
                <path d="M 355 280 Q 365 250 375 280 L 375 360 L 355 360 Z" class="pencil-line" />
                <path d="M 445 280 Q 455 250 465 280 L 465 360 L 445 360 Z" class="pencil-line" />
                <path d="M 535 280 Q 545 250 555 280 L 555 360 L 535 360 Z" class="pencil-line" />
                <path d="M 625 280 Q 635 250 645 280 L 645 360 L 625 360 Z" class="pencil-line" />
                <path d="M 715 280 Q 725 250 735 280 L 735 360 L 715 360 Z" class="pencil-line" />
                <path d="M 805 280 Q 815 250 825 280 L 825 360 L 805 360 Z" class="pencil-line" />

                <!-- หลังคาทรงไทยซ้อนชั้นสง่างาม (Wide Perspective Roof) -->
                <path d="M 100 220 L 500 110 L 900 220 Z" class="pencil-line" />
                <path d="M 130 180 L 500 80 L 870 180 Z" class="pencil-line" />
                <path d="M 160 140 L 500 50 L 840 140 Z" class="pencil-line" />

                <!-- ยอดฉัตร 7 ชั้น (Seven-Tiered Chattra) -->
                <line x1="500" y1="50" x2="500" y2="10" class="pencil-line" />
                <line x1="488" y1="16" x2="512" y2="16" class="pencil-line" />
                <line x1="491" y1="22" x2="509" y2="22" class="pencil-line" />
                <line x1="488" y1="28" x2="512" y2="28" class="pencil-line" />
                <line x1="491" y1="34" x2="509" y2="34" class="pencil-line" />
                <line x1="488" y1="40" x2="512" y2="40" class="pencil-line" />
                <line x1="491" y1="46" x2="509" y2="46" class="pencil-line" />
                <circle cx="500" cy="7" r="3" fill="#42372a" />

                <!-- ลายมือสถาปนิกเชิงอรรถ (Architect Notes) -->
                <text x="60" y="55" class="pencil-text" style="font-style: italic;">Project: Glass Cathedral 100M (Wide Angle)</text>
                <text x="60" y="70" class="pencil-text" style="font-style: italic;">Engine: Bodhi-Panya v9.0 (iPhone Genesis)</text>
                <text x="60" y="85" class="pencil-text" style="font-style: italic;">Tribute: หลวงพ่อฤาษีลิงดำ วัดท่าซุง</text>

                <text x="825" y="490" class="pencil-text" style="font-weight: 600;">"สัมปติจฉามิ"</text>
            </svg>

            <!-- คำโปรยท้ายภาพสเก็ตช์ -->
            <div class="mt-4 pt-4 border-t border-stone-300 text-center text-xs text-stone-600 flex justify-between items-center">
                <span>📐 สไตล์: Wide Angle Sketch + เส้นประนำสายตา (Perspective Guide)</span>
                <span class="font-semibold text-stone-800">น้อมบูชาครูบาอาจารย์ | พักผ่อนกายสบายใจ</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-5xl mx-auto w-full text-center text-xs text-stone-500 pt-4">
        <span>หจก. เชียงใหม่ 63 การช่าง & Bodhi-Panya v9.0 Engine — หลับพักผ่อนให้สบายครับช่างเบิร์ด</span>
    </footer>

</body>
</html>
