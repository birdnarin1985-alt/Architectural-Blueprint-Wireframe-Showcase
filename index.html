<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya v9.0 - Full Structure Rendering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #151515; color: #e5e5e5; overflow: hidden; margin: 0; }
        
        #viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f3ec;
            background-image: 
                linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        canvas { width: 100%; height: 100%; display: block; }
        .hud-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="hud-overlay text-zinc-800">
            <h1 class="text-xl font-bold text-amber-600">⚙️ Bodhi-Panya v9.0</h1>
            <p class="text-xs font-bold font-mono uppercase">Full BIM Structure: Glass Cathedral 100m</p>
            <div id="debug-info" class="text-[10px] text-zinc-500 mt-2 font-mono"></div>
        </div>

        <canvas id="engineCanvas"></canvas>
        
        <div class="absolute bottom-4 right-6 text-right">
            <div class="text-xl font-bold text-zinc-800 font-serif italic">ช่างเบิร์ด</div>
            <div class="text-[10px] font-bold text-amber-700 tracking-widest">สัมปติจฉามิ</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        const debugInfo = document.getElementById('debug-info');

        class Vector3 {
            constructor(x, y, z) { this.x = x; this.y = y; this.z = z; }
        }

        let camera = { scale: 1, offsetX: 0, offsetY: 0 };

        function getRaw2D(vec3) {
            const angle = Math.PI / 6; 
            const x2d = (vec3.x - vec3.z) * Math.cos(angle);
            const y2d = vec3.y + (vec3.x + vec3.z) * Math.sin(angle);
            return { x: x2d, y: -y2d };
        }

        function project(vec3) {
            const raw = getRaw2D(vec3);
            return {
                x: (raw.x * camera.scale) + camera.offsetX,
                y: (raw.y * camera.scale) + camera.offsetY
            };
        }

        function calculateAutoCamera(vertices) {
            if (vertices.length === 0) return;
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            vertices.forEach(v => {
                const raw = getRaw2D(v);
                if (raw.x < minX) minX = raw.x; if (raw.x > maxX) maxX = raw.x;
                if (raw.y < minY) minY = raw.y; if (raw.y > maxY) maxY = raw.y;
            });
            const modelWidth = maxX - minX; const modelHeight = maxY - minY;
            const padding = 0.75; // เว้นขอบกระดาษ 25%
            camera.scale = Math.min((canvas.width * padding) / modelWidth, (canvas.height * padding) / modelHeight);
            
            // ดันให้ภาพอยู่ตรงกลาง (ชดเชยแกน Y ลงมานิดหน่อยให้สวยงาม)
            camera.offsetX = (canvas.width / 2) - ((minX + maxX) / 2 * camera.scale);
            camera.offsetY = (canvas.height / 2) - ((minY + maxY) / 2 * camera.scale) + (canvas.height * 0.05);
            
            debugInfo.innerHTML = `Screen: ${canvas.width}x${canvas.height}<br>Scale: ${camera.scale.toFixed(2)}<br>Nodes: ${vertices.length}`;
        }

        function drawArchitectLine(p1, p2, isBold = false) {
            ctx.beginPath();
            const dx = p2.x - p1.x; const dy = p2.y - p1.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            if(length === 0) return;
            
            const overX = (dx / length) * (Math.random() * 5 + 2); 
            const overY = (dy / length) * (Math.random() * 5 + 2);
            const startX = p1.x - overX; const startY = p1.y - overY;
            const endX = p2.x + overX; const endY = p2.y + overY;

            ctx.moveTo(startX, startY);
            const segments = 8;
            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const jitterX = (startX + (endX - startX) * t) + (Math.random() - 0.5) * 0.8;
                const jitterY = (startY + (endY - startY) * t) + (Math.random() - 0.5) * 0.8;
                ctx.lineTo(jitterX, jitterY);
            }
            ctx.strokeStyle = isBold ? '#1f1f1f' : '#737373';
            ctx.lineWidth = isBold ? 1.2 : 0.5;
            ctx.stroke();

            // รอยย้ำหมึก
            if (isBold && Math.random() > 0.5) {
                ctx.beginPath();
                ctx.moveTo(startX + Math.random(), startY + Math.random());
                ctx.lineTo(endX + Math.random(), endY + Math.random());
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }

        let allNodes = [];
        let geometry = { foundation: [], pillars: [], roofs: [], chattra: [] };

        function generateBIMModel() {
            allNodes = []; geometry = { foundation: [], pillars: [], roofs: [], chattra: [] };
            
            // 1. Foundation (ฐานราก)
            const w = 120, d = 220, h = 15;
            geometry.foundation = [
                new Vector3(-w, 0, -d), new Vector3(w, 0, -d), new Vector3(w, 0, d), new Vector3(-w, 0, d),
                new Vector3(-w, h, -d), new Vector3(w, h, -d), new Vector3(w, h, d), new Vector3(-w, h, d)
            ];

            // 2. Pillars (เสา) 6 คู่
            const pHeight = 80;
            const pInset = 15; // ระยะร่นจากขอบฐาน
            const zStep = (d * 2 - pInset * 2) / 5;
            for(let i=0; i<=5; i++) {
                const zPos = -d + pInset + (i * zStep);
                // เสาซ้าย
                geometry.pillars.push({ base: new Vector3(-w + pInset, h, zPos), top: new Vector3(-w + pInset, h + pHeight, zPos) });
                // เสาขวา
                geometry.pillars.push({ base: new Vector3(w - pInset, h, zPos), top: new Vector3(w - pInset, h + pHeight, zPos) });
            }

            // 3. Layered Roofs (หลังคา 3 ชั้น)
            const rBaseY = h + pHeight;
            // ชั้น 1 (กว้างสุด)
            geometry.roofs.push([
                new Vector3(-w-10, rBaseY, -d-10), new Vector3(w+10, rBaseY, -d-10), new Vector3(w+10, rBaseY, d+10), new Vector3(-w-10, rBaseY, d+10),
                new Vector3(-w*0.7, rBaseY+30, -d*0.7), new Vector3(w*0.7, rBaseY+30, -d*0.7), new Vector3(w*0.7, rBaseY+30, d*0.7), new Vector3(-w*0.7, rBaseY+30, d*0.7)
            ]);
            // ชั้น 2
            geometry.roofs.push([
                new Vector3(-w*0.7, rBaseY+30, -d*0.7), new Vector3(w*0.7, rBaseY+30, -d*0.7), new Vector3(w*0.7, rBaseY+30, d*0.7), new Vector3(-w*0.7, rBaseY+30, d*0.7),
                new Vector3(-w*0.4, rBaseY+60, -d*0.4), new Vector3(w*0.4, rBaseY+60, -d*0.4), new Vector3(w*0.4, rBaseY+60, d*0.4), new Vector3(-w*0.4, rBaseY+60, d*0.4)
            ]);
            // ชั้น 3 (จั่วสูงสุด)
            const ridgeY = rBaseY + 90;
            geometry.roofs.push([
                new Vector3(-w*0.4, rBaseY+60, -d*0.4), new Vector3(w*0.4, rBaseY+60, -d*0.4), new Vector3(w*0.4, rBaseY+60, d*0.4), new Vector3(-w*0.4, rBaseY+60, d*0.4),
                new Vector3(0, ridgeY, -d*0.2), new Vector3(0, ridgeY, -d*0.2), new Vector3(0, ridgeY, d*0.2), new Vector3(0, ridgeY, d*0.2) // รวบเป็นสันจั่ว
            ]);

            // 4. Chattra (ยอดฉัตร 7 ชั้น)
            const cBaseY = ridgeY;
            const cHeight = 80;
            geometry.chattra.push(new Vector3(0, cBaseY, 0));
            geometry.chattra.push(new Vector3(0, cBaseY + cHeight, 0)); // เสาหลัก
            
            // ชั้นฉัตรแนวนอน
            for(let i=1; i<=7; i++) {
                const tierY = cBaseY + (i * 10);
                const tierW = 20 - (i * 2); // ยิ่งสูงยิ่งแคบลง
                geometry.chattra.push(new Vector3(-tierW, tierY, 0));
                geometry.chattra.push(new Vector3(tierW, tierY, 0));
            }

            // รวบรวม Node ทั้งหมดให้กล้องคำนวณขนาด
            allNodes.push(...geometry.foundation);
            geometry.pillars.forEach(p => allNodes.push(p.base, p.top));
            geometry.roofs.forEach(r => allNodes.push(...r));
            allNodes.push(...geometry.chattra);
        }

        function drawQuad(p1, p2, p3, p4, isBold) {
            drawArchitectLine(p1, p2, isBold); drawArchitectLine(p2, p3, isBold);
            drawArchitectLine(p3, p4, isBold); drawArchitectLine(p4, p1, isBold);
        }

        function renderScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. วาดฐาน
            const f = geometry.foundation.map(project);
            drawQuad(f[0], f[1], f[2], f[3], false); // bottom
            drawQuad(f[4], f[5], f[6], f[7], true);  // top
            drawArchitectLine(f[0], f[4], true); drawArchitectLine(f[1], f[5], true);
            drawArchitectLine(f[2], f[6], true); drawArchitectLine(f[3], f[7], true);

            // 2. วาดเสา
            geometry.pillars.forEach(p => {
                drawArchitectLine(project(p.base), project(p.top), false);
            });

            // 3. วาดหลังคา
            geometry.roofs.forEach((r, index) => {
                const proj = r.map(project);
                drawQuad(proj[0], proj[1], proj[2], proj[3], true); // ชายคา
                if(index < 2) {
                    drawQuad(proj[4], proj[5], proj[6], proj[7], false); // โครงใน
                    drawArchitectLine(proj[0], proj[4], false); drawArchitectLine(proj[1], proj[5], false);
                    drawArchitectLine(proj[2], proj[6], false); drawArchitectLine(proj[3], proj[7], false);
                } else {
                    // จั่วชั้นบนสุด (เส้นสันหลังคา)
                    drawArchitectLine(proj[0], proj[4], true); drawArchitectLine(proj[1], proj[4], true);
                    drawArchitectLine(proj[2], proj[6], true); drawArchitectLine(proj[3], proj[6], true);
                    drawArchitectLine(proj[4], proj[6], true); // สันจั่ว
                }
            });

            // 4. วาดยอดฉัตร
            const c = geometry.chattra.map(project);
            drawArchitectLine(c[0], c[1], true); // แกนหลัก
            for(let i=2; i<c.length; i+=2) {
                drawArchitectLine(c[i], c[i+1], true); // ชั้นฉัตร
            }
        }

        function initApp() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            generateBIMModel();
            calculateAutoCamera(allNodes);
            renderScene();
        }

        window.addEventListener('resize', initApp);
        initApp();
    </script>
</body>
</html>
