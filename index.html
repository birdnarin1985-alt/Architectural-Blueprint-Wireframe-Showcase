<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya v9.0 - Unified BIM & Brush Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1a1a1a; margin: 0; overflow: hidden; }
        #viewport {
            width: 100vw; height: 100vh;
            background-color: #f7f6f0;
            background-image: radial-gradient(#d6cfbc 1px, transparent 1px);
            background-size: 24px 24px;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .hud { position: absolute; top: 20px; left: 20px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="hud">
            <h1 class="text-xl font-bold text-amber-700">⚙️ Bodhi-Panya v9.0</h1>
            <p class="text-xs font-bold text-zinc-500 uppercase tracking-widest">Global 3D Array & Pattern Brushes</p>
        </div>
        <canvas id="engineCanvas"></canvas>
        <div class="absolute bottom-6 right-6 text-right pointer-events-none">
            <div class="text-xl font-bold text-zinc-800 font-serif italic">ช่างเบิร์ด</div>
            <div class="text-[10px] font-bold text-amber-600 tracking-widest">สัมปติจฉามิ</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        let camera = { scale: 1, offsetX: 0, offsetY: 0 };
        let globalBIMArray = []; // อาร์เรย์ 3 มิติส่วนกลาง
        let brushLibrary = {}; // คลังเก็บแปรงคอมโพเนนต์

        class Vector3 { constructor(x, y, z) { this.x = x; this.y = y; this.z = z; } }

        // ==========================================
        // 🖌️ 1. ระบบสร้างคอมโพเนนต์แปรงสี (Pattern Brush Library)
        // ==========================================
        function createHatchBrush(name, angle, density, color, thickness) {
            const offscreen = document.createElement('canvas');
            offscreen.width = density; offscreen.height = density;
            const oCtx = offscreen.getContext('2d');
            
            oCtx.strokeStyle = color;
            oCtx.lineWidth = thickness;
            oCtx.beginPath();
            
            if (angle === 'diagonal') {
                oCtx.moveTo(0, density); oCtx.lineTo(density, 0);
            } else if (angle === 'cross') {
                oCtx.moveTo(0, 0); oCtx.lineTo(density, density);
                oCtx.moveTo(0, density); oCtx.lineTo(density, 0);
            } else if (angle === 'vertical') {
                oCtx.moveTo(density/2, 0); oCtx.lineTo(density/2, density);
            }
            
            oCtx.stroke();
            brushLibrary[name] = ctx.createPattern(offscreen, 'repeat');
        }

        function initBrushes() {
            createHatchBrush('roofHatch', 'diagonal', 12, 'rgba(100, 90, 80, 0.3)', 0.8);
            createHatchBrush('foundationHatch', 'vertical', 8, 'rgba(0, 0, 0, 0.15)', 1);
            createHatchBrush('shadowHatch', 'cross', 10, 'rgba(50, 50, 50, 0.25)', 0.5);
            brushLibrary['paperSolid'] = '#f7f6f0'; // สีพื้นกระดาษทึบสำหรับบังวัตถุ
            brushLibrary['goldAccent'] = '#d97706';
        }

        // ==========================================
        // 📐 2. ระบบคำนวณกล้อง 3D (Isometric Projection)
        // ==========================================
        function project(vec3) {
            const angle = Math.PI / 6; 
            const x2d = (vec3.x - vec3.z) * Math.cos(angle);
            const y2d = vec3.y + (vec3.x + vec3.z) * Math.sin(angle);
            return { x: (x2d * camera.scale) + camera.offsetX, y: (-y2d * camera.scale) + camera.offsetY };
        }

        // ==========================================
        // 🧱 3. สร้างโมเดล 3D พร้อมฝัง Attribute แปรงสี
        // ==========================================
        function buildGlobalArray() {
            globalBIMArray = [];
            const w = 120, d = 200, h = 15;

            // ฟังก์ชันช่วยสร้าง Polygon พร้อม Attribute แบบ Data-Driven
            const addPoly = (vertices, brushFill, strokeColor, strokeWidth, jitter) => {
                globalBIMArray.push({
                    vertices: vertices,
                    style: { fill: brushFill, stroke: strokeColor, width: strokeWidth, jitter: jitter },
                    zDepth: 0 // จะคำนวณทีหลัง
                });
            };

            // --- ฐานราก (Foundation) ---
            const fB = [new Vector3(-w,0,-d), new Vector3(w,0,-d), new Vector3(w,0,d), new Vector3(-w,0,d)];
            const fT = [new Vector3(-w,h,-d), new Vector3(w,h,-d), new Vector3(w,h,d), new Vector3(-w,h,d)];
            addPoly(fT, 'paperSolid', '#111', 1.5, 3); // แผ่นบน
            addPoly([fB[0], fB[1], fT[1], fT[0]], 'foundationHatch', '#333', 1.0, 2); // แผ่นข้าง
            addPoly([fB[1], fB[2], fT[2], fT[1]], 'foundationHatch', '#333', 1.0, 2);
            addPoly([fB[2], fB[3], fT[3], fT[2]], 'foundationHatch', '#333', 1.0, 2);
            addPoly([fB[3], fB[0], fT[0], fT[3]], 'foundationHatch', '#333', 1.0, 2);

            // --- เสาโถงวิหาร (Pillars) ---
            const pHeight = 60, pInset = 15;
            for(let i=0; i<=4; i++) {
                const zPos = -d + pInset + (i * ((d*2 - pInset*2)/4));
                // เสาเป็นแค่เส้น ไม่มีการ Fill (brushFill = null)
                addPoly([new Vector3(-w+pInset, h, zPos), new Vector3(-w+pInset, h+pHeight, zPos)], null, '#555', 0.8, 1);
                addPoly([new Vector3(w-pInset, h, zPos), new Vector3(w-pInset, h+pHeight, zPos)], null, '#555', 0.8, 1);
            }

            // --- หลังคาทรงไทย (Layered Roof) ---
            const rBase = h + pHeight;
            const r1B = [new Vector3(-w-15, rBase, -d-15), new Vector3(w+15, rBase, -d-15), new Vector3(w+15, rBase, d+15), new Vector3(-w-15, rBase, d+15)];
            const r1T = [new Vector3(-w*0.6, rBase+40, -d*0.6), new Vector3(w*0.6, rBase+40, -d*0.6), new Vector3(w*0.6, rBase+40, d*0.6), new Vector3(-w*0.6, rBase+40, d*0.6)];
            const r2T = [new Vector3(0, rBase+80, -d*0.2), new Vector3(0, rBase+80, -d*0.2), new Vector3(0, rBase+80, d*0.2), new Vector3(0, rBase+80, d*0.2)]; // ยอดจั่ว
            
            const addRoofTier = (base, top) => {
                // เทสีทึบบังเสาก่อน แล้วค่อยวาดแพทเทิร์นแรเงาทับ
                addPoly([base[0], base[1], top[1], top[0]], 'paperSolid', '#1a1a1a', 1.2, 4);
                addPoly([base[0], base[1], top[1], top[0]], 'roofHatch', 'transparent', 0, 0); // Layer แรเงา
                
                addPoly([base[1], base[2], top[2], top[1]], 'paperSolid', '#1a1a1a', 1.2, 4);
                addPoly([base[1], base[2], top[2], top[1]], 'roofHatch', 'transparent', 0, 0);

                addPoly([base[2], base[3], top[3], top[2]], 'paperSolid', '#1a1a1a', 1.2, 4);
                addPoly([base[2], base[3], top[3], top[2]], 'shadowHatch', 'transparent', 0, 0); // ด้านมืด

                addPoly([base[3], base[0], top[0], top[3]], 'paperSolid', '#1a1a1a', 1.2, 4);
                addPoly([base[3], base[0], top[0], top[3]], 'roofHatch', 'transparent', 0, 0);
            };
            addRoofTier(r1B, r1T);
            addRoofTier(r1T, r2T);

            // --- ยอดฉัตร (Chattra) ---
            const cBase = rBase+80;
            addPoly([new Vector3(0, cBase, 0), new Vector3(0, cBase+80, 0)], null, '#b47a18', 1.5, 2); // แกน
            for(let i=1; i<=5; i++) {
                const tW = 15 - (i*2);
                addPoly([new Vector3(-tW, cBase+(i*12), 0), new Vector3(tW, cBase+(i*12), 0)], null, '#b47a18', 1.2, 1);
            }
        }

        // ==========================================
        // 🚀 4. The Render Pipeline (รันปั้งเดียวจบ)
        // ==========================================
        function drawSketchLine(p1, p2, style) {
            if(style.stroke === 'transparent' || style.width === 0) return;
            
            ctx.beginPath();
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.sqrt(dx*dx + dy*dy);
            if(len === 0) return;
            
            // ใช้ Attribute Jitter ควบคุมการตวัดเส้น
            const over = (style.jitter / len) * 4; 
            const sX = p1.x - (dx*over), sY = p1.y - (dy*over);
            const eX = p2.x + (dx*over), eY = p2.y + (dy*over);

            ctx.moveTo(sX, sY);
            for (let i = 1; i <= 5; i++) {
                ctx.lineTo((sX + (eX - sX) * (i/5)) + (Math.random()-0.5)*style.jitter, 
                           (sY + (eY - sY) * (i/5)) + (Math.random()-0.5)*style.jitter);
            }
            
            ctx.strokeStyle = style.stroke;
            ctx.lineWidth = style.width;
            ctx.stroke();
        }

        function renderPass() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Auto-Camera (คำนวณขนาดจอ)
            let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
            globalBIMArray.forEach(poly => poly.vertices.forEach(v => {
                const raw = project(v); // project แบบสเกล 1 เพื่อหาขอบเขต
                if(raw.x < minX) minX=raw.x; if(raw.x > maxX) maxX=raw.x;
                if(raw.y < minY) minY=raw.y; if(raw.y > maxY) maxY=raw.y;
            }));
            const pW = maxX-minX, pH = maxY-minY;
            camera.scale = Math.min((canvas.width * 0.8)/pW, (canvas.height * 0.75)/pH);
            camera.offsetX = (canvas.width/2) - ((minX+maxX)/2 * camera.scale);
            camera.offsetY = (canvas.height/2) - ((minY+maxY)/2 * camera.scale) + (canvas.height * 0.05);

            // 2. Global Z-Depth Sorting (คำนวณความลึกรวดเดียว)
            globalBIMArray.forEach(poly => {
                let zSum = 0;
                poly.vertices.forEach(v => zSum += (v.x + v.y + v.z));
                poly.zDepth = zSum / poly.vertices.length;
            });
            globalBIMArray.sort((a, b) => a.zDepth - b.zDepth);

            // 3. Single Render Loop (ปาดแปรง + ขีดเส้น)
            globalBIMArray.forEach(poly => {
                const pts = poly.vertices.map(project);
                
                // ถ้าระบุ brushFill ให้สร้าง Path แล้วสาดสี/แพทเทิร์น
                if (poly.style.fill && pts.length > 2) {
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.closePath();
                    
                    // ดึงคอมโพเนนต์แปรงสีมาจาก Library โดยอัตโนมัติ
                    ctx.fillStyle = brushLibrary[poly.style.fill] || poly.style.fill;
                    ctx.fill();
                }

                // ขีดเส้นขอบสเก็ตช์ตามสไตล์ที่กำหนด
                for(let i=0; i<pts.length; i++) {
                    const nextIdx = (poly.vertices.length === 2) ? 1 : (i+1)%pts.length;
                    drawSketchLine(pts[i], pts[nextIdx], poly.style);
                    if(poly.vertices.length === 2) break; // ถ้าเป็นแค่เส้น (เสา) ขีดรอบเดียวจบ
                }
            });
        }

        function initApp() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initBrushes();
            buildGlobalArray();
            renderPass();
        }

        window.addEventListener('resize', initApp);
        initApp();
    </script>
</body>
</html>
