<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya v9.0 - Decoupled Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1a1a1a; margin: 0; overflow: hidden; }
        #viewport {
            width: 100vw; height: 100vh; position: relative;
            background-color: #f7f6f0;
            background-image: radial-gradient(#d6cfbc 1px, transparent 1px);
            background-size: 24px 24px;
        }
        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        
        #bim-panel {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(255, 253, 245, 0.95); border-left: 4px solid #b47a18;
            padding: 16px 24px; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-width: 90%; width: 400px; opacity: 0; pointer-events: none; transition: all 0.3s ease;
        }
        #bim-panel.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    </style>
</head>
<body>

    <div id="viewport">
        <div class="absolute top-5 left-5 pointer-events-none">
            <h1 class="text-xl font-bold text-amber-700">⚙️ Bodhi-Panya v9.0</h1>
            <p class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Input/Display Decoupled Engine</p>
        </div>
        
        <canvas id="engineCanvas"></canvas>

        <div id="bim-panel">
            <h3 id="bim-title" class="text-lg font-bold text-zinc-900 mb-1">หัวข้อ</h3>
            <p id="bim-desc" class="text-sm text-zinc-700 leading-relaxed font-serif italic">รายละเอียด</p>
        </div>

        <div class="absolute bottom-6 right-6 text-right pointer-events-none">
            <div class="text-xl font-bold text-zinc-800 font-serif italic">ช่างเบิร์ด</div>
            <div class="text-[10px] font-bold text-amber-600 tracking-widest">สัมปติจฉามิ</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');
        let camera = { scale: 1, offsetX: 0, offsetY: 0 };
        let globalBIMArray = []; 
        let brushLibrary = {}; 
        
        // --- 🎮 STATE MANAGEMENT (แยก Input ออกจาก Display) ---
        let inputState = { mouseX: -100, mouseY: -100, hoveredId: null };
        
        const bimDatabase = {
            'foundation': { title: "🧱 ฐานรากวิหาร 100 เมตร", desc: "ฐานรากทึบตัน รับน้ำหนักโครงสร้างทั้งหมด พร้อมระบบแรเงาตั้ง (Vertical Hatching)" },
            'roof': { title: "🏛️ หลังคาทรงไทยประยุกต์", desc: "ใช้แปรงฝนดินสอเฉียง (Diagonal Pattern) สาดลงบนอาร์เรย์ 3 มิติปั้งเดียวจบ" },
            'pillar': { title: "📐 แนวเสาบีมแก้ว", desc: "แนวเสาเรียงตามสัดส่วนทองคำ เรนเดอร์ด้วยความลึกแบบ Global Z-Depth" },
            'chattra': { title: "✨ ยอดฉัตร 7 ชั้น", desc: "ศูนย์รวมความศรัทธา ประกอบขึ้นด้วยสมการคณิตศาสตร์ล้วนๆ" }
        };

        class Vector3 { constructor(x, y, z) { this.x = x; this.y = y; this.z = z; } }

        function initBrushes() {
            const createBrush = (name, type, size, color, lw) => {
                const osc = document.createElement('canvas'); osc.width = size; osc.height = size;
                const oCtx = osc.getContext('2d'); oCtx.strokeStyle = color; oCtx.lineWidth = lw; oCtx.beginPath();
                if(type==='diag') { oCtx.moveTo(0,size); oCtx.lineTo(size,0); }
                else if(type==='vert') { oCtx.moveTo(size/2,0); oCtx.lineTo(size/2,size); }
                else if(type==='cross') { oCtx.moveTo(0,0); oCtx.lineTo(size,size); oCtx.moveTo(0,size); oCtx.lineTo(size,0); }
                oCtx.stroke(); brushLibrary[name] = ctx.createPattern(osc, 'repeat');
            };
            createBrush('roofHatch', 'diag', 12, 'rgba(100, 90, 80, 0.4)', 0.8);
            createBrush('baseHatch', 'vert', 8, 'rgba(0, 0, 0, 0.2)', 1);
            createBrush('shadow', 'cross', 10, 'rgba(50, 50, 50, 0.3)', 0.5);
            brushLibrary['solid'] = '#f7f6f0';
        }

        function project(vec3) {
            const angle = Math.PI / 6; 
            return { 
                x: ((vec3.x - vec3.z) * Math.cos(angle) * camera.scale) + camera.offsetX, 
                y: (-(vec3.y + (vec3.x + vec3.z) * Math.sin(angle)) * camera.scale) + camera.offsetY 
            };
        }

        function buildGlobalArray() {
            globalBIMArray = [];
            const addPoly = (id, vertices, fill, stroke, width, jitter) => {
                globalBIMArray.push({ id, vertices, style: { fill, stroke, width, jitter }, zDepth: 0 });
            };

            const w = 120, d = 200, h = 15;
            // ฐานราก
            const fB = [new Vector3(-w,0,-d), new Vector3(w,0,-d), new Vector3(w,0,d), new Vector3(-w,0,d)];
            const fT = [new Vector3(-w,h,-d), new Vector3(w,h,-d), new Vector3(w,h,d), new Vector3(-w,h,d)];
            addPoly('foundation', fT, 'solid', '#222', 1.5, 3);
            [0,1,2,3].forEach(i => addPoly('foundation', [fB[i], fB[(i+1)%4], fT[(i+1)%4], fT[i]], 'baseHatch', '#333', 1, 2));

            // เสา
            for(let i=0; i<=4; i++) {
                const zP = -d + 15 + (i * ((d*2 - 30)/4));
                addPoly('pillar', [new Vector3(-w+15, h, zP), new Vector3(-w+15, h+60, zP)], null, '#555', 1, 1);
                addPoly('pillar', [new Vector3(w-15, h, zP), new Vector3(w-15, h+60, zP)], null, '#555', 1, 1);
            }

            // หลังคา
            const rB = h+60;
            const r1B = [new Vector3(-w-15,rB,-d-15), new Vector3(w+15,rB,-d-15), new Vector3(w+15,rB,d+15), new Vector3(-w-15,rB,d+15)];
            const r1T = [new Vector3(-w*0.6,rB+40,-d*0.6), new Vector3(w*0.6,rB+40,-d*0.6), new Vector3(w*0.6,rB+40,d*0.6), new Vector3(-w*0.6,rB+40,d*0.6)];
            const r2T = [new Vector3(0,rB+80,-d*0.2), new Vector3(0,rB+80,-d*0.2), new Vector3(0,rB+80,d*0.2), new Vector3(0,rB+80,d*0.2)];
            
            const addTier = (b, t) => {
                [0,1,2,3].forEach(i => {
                    addPoly('roof', [b[i], b[(i+1)%4], t[(i+1)%4], t[i]], 'solid', '#111', 1.2, 4);
                    addPoly('roof', [b[i], b[(i+1)%4], t[(i+1)%4], t[i]], (i===2 || i===3) ? 'shadow' : 'roofHatch', 'transparent', 0, 0);
                });
            };
            addTier(r1B, r1T); addTier(r1T, r2T);

            // ยอดฉัตร
            addPoly('chattra', [new Vector3(0, rB+80, 0), new Vector3(0, rB+160, 0)], null, '#b47a18', 2, 2);
            for(let i=1; i<=5; i++) addPoly('chattra', [new Vector3(-(15-i*2), rB+80+(i*12), 0), new Vector3((15-i*2), rB+80+(i*12), 0)], null, '#b47a18', 1.5, 1);
        }

        // --- 🎯 1. ฝั่ง INPUT (ประมวลผล Raycasting) ---
        function processInput() {
            inputState.hoveredId = null;
            // เช็คจากชิ้นที่อยู่ใกล้ตาที่สุดไปหาไกลที่สุด (Reverse Z-Index)
            for (let i = globalBIMArray.length - 1; i >= 0; i--) {
                const poly = globalBIMArray[i];
                const pts = poly.vertices.map(project);
                
                if (pts.length > 2) {
                    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
                    for(let j=1; j<pts.length; j++) ctx.lineTo(pts[j].x, pts[j].y);
                    if (ctx.isPointInPath(inputState.mouseX, inputState.mouseY)) {
                        inputState.hoveredId = poly.id; break; // เจอชิ้นแรกที่โดนนิ้วให้หยุดคำนวณเลย
                    }
                } else {
                    const cx = (pts[0].x + pts[1].x)/2, cy = (pts[0].y + pts[1].y)/2;
                    if (Math.hypot(inputState.mouseX - cx, inputState.mouseY - cy) < 30) {
                        inputState.hoveredId = poly.id; break;
                    }
                }
            }
            updateUI();
        }

        function updateUI() {
            const panel = document.getElementById('bim-panel');
            if (inputState.hoveredId && bimDatabase[inputState.hoveredId]) {
                document.getElementById('bim-title').innerText = bimDatabase[inputState.hoveredId].title;
                document.getElementById('bim-desc').innerText = bimDatabase[inputState.hoveredId].desc;
                panel.classList.add('active'); canvas.style.cursor = 'pointer';
            } else {
                panel.classList.remove('active'); canvas.style.cursor = 'crosshair';
            }
        }

        // --- 🎨 2. ฝั่ง DISPLAY (เรนเดอร์กราฟิกเพียวๆ) ---
        function drawLine(p1, p2, style, isHovered) {
            if(style.stroke === 'transparent' || style.width === 0) return;
            ctx.beginPath();
            const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy); if(len===0) return;
            
            const over = (style.jitter/len)*3, sX = p1.x-(dx*over), sY = p1.y-(dy*over), eX = p2.x+(dx*over), eY = p2.y+(dy*over);
            ctx.moveTo(sX, sY);
            for (let i = 1; i <= 4; i++) ctx.lineTo((sX+(eX-sX)*(i/4))+(Math.random()-0.5)*style.jitter, (sY+(eY-sY)*(i/4))+(Math.random()-0.5)*style.jitter);
            
            // อ่านค่า State เพื่อเปลี่ยนหัวแปรง
            ctx.strokeStyle = isHovered ? '#d97706' : style.stroke;
            ctx.lineWidth = isHovered ? style.width * 1.5 : style.width;
            ctx.stroke();
        }

        function renderPass() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // สาดแปรงตามลำดับความลึก
            globalBIMArray.forEach(poly => {
                const pts = poly.vertices.map(project);
                const isHovered = (poly.id === inputState.hoveredId);

                if (poly.style.fill && pts.length > 2) {
                    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
                    for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.closePath();
                    
                    if(poly.style.fill === 'solid') {
                        ctx.fillStyle = isHovered ? '#fff3d4' : brushLibrary['solid'];
                    } else {
                        ctx.fillStyle = brushLibrary[poly.style.fill];
                    }
                    ctx.fill();
                }

                for(let i=0; i<pts.length; i++) {
                    drawLine(pts[i], pts[(poly.vertices.length===2)?1:(i+1)%pts.length], poly.style, isHovered);
                    if(poly.vertices.length===2) break;
                }
            });
        }

        // --- ⚙️ ENGINE LOOP ---
        function calculateCamera() {
            let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
            globalBIMArray.forEach(poly => {
                let zSum = 0;
                poly.vertices.forEach(v => {
                    const r = project({x:v.x, y:v.y, z:v.z}); // project at scale 1
                    if(r.x<minX) minX=r.x; if(r.x>maxX) maxX=r.x; if(r.y<minY) minY=r.y; if(r.y>maxY) maxY=r.y;
                    zSum += (v.x+v.y+v.z);
                });
                poly.zDepth = zSum / poly.vertices.length; // คำนวณความลึกไปด้วยเลย
            });
            globalBIMArray.sort((a,b) => a.zDepth - b.zDepth); // Sort Array รวดเดียวจบ
            
            camera.scale = Math.min((canvas.width*0.8)/(maxX-minX), (canvas.height*0.75)/(maxY-minY));
            camera.offsetX = (canvas.width/2) - ((minX+maxX)/2 * camera.scale);
            camera.offsetY = (canvas.height/2) - ((minY+maxY)/2 * camera.scale) + (canvas.height*0.05);
        }

        function onPointerMove(e) {
            const r = canvas.getBoundingClientRect();
            inputState.mouseX = (e.clientX || (e.touches && e.touches[0].clientX)) - r.left;
            inputState.mouseY = (e.clientY || (e.touches && e.touches[0].clientY)) - r.top;
            
            processInput(); // Input ทำหน้าที่คำนวณ Raycast
            renderPass();   // Display ทำหน้าที่ปาดแปรงตาม State
        }

        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('touchstart', onPointerMove, {passive: true});
        canvas.addEventListener('touchmove', onPointerMove, {passive: true});

        function initApp() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            initBrushes(); buildGlobalArray(); calculateCamera(); renderPass();
        }
        window.addEventListener('resize', initApp);
        initApp();
    </script>
</body>
</html>
