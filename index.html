<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi-Panya v9.0 - Math & Algorithm Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #1e1e1e; color: #e5e5e5; }
        canvas { 
            background-color: #f7f6f0; 
            box-shadow: inset 0 0 50px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full">
        <div class="mb-4">
            <h1 class="text-2xl font-bold text-amber-500">⚙️ Bodhi-Panya Engine: Algorithm Core</h1>
            <p class="text-xs text-zinc-400">ระบบประมวลผลพิกัด 3D สู่ลายเส้นสเก็ตช์ 2D (Isometric Projection & Procedural Jitter)</p>
        </div>

        <!-- เราเปลี่ยนมาใช้ Canvas สำหรับประมวลผลคณิตศาสตร์ระดับพิกเซล -->
        <canvas id="engineCanvas" width="800" height="600" class="w-full h-auto drop-shadow-2xl"></canvas>

        <div class="mt-4 text-center text-xs text-zinc-500">
            ระบบกำลังเรนเดอร์โครงสร้างฐานรากด้วยสมการ 3 มิติ... <span class="text-amber-600 font-bold">สัมปติจฉามิ</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('engineCanvas');
        const ctx = canvas.getContext('2d');

        // =========================================================
        // 🧱 STEP 1: โครงสร้างข้อมูล 3 มิติ (BIM Data Structure)
        // กำหนดแกน X (กว้าง), Y (สูง), Z (ลึก) ในโลก 3D จริง
        // =========================================================
        class Vector3 {
            constructor(x, y, z) {
                this.x = x;
                this.y = y;
                this.z = z;
            }
        }

        // =========================================================
        // 📐 STEP 2: อัลกอริทึมแปลง 3D เป็น 2D (Isometric Math)
        // สมการคณิตศาสตร์จำลองเลนส์มุมมองสูงของสถาปนิก
        // =========================================================
        function project(vec3) {
            // ตั้งค่ากล้อง (Camera Settings)
            const scale = 1.8; // อัตราส่วนสเกล
            const offsetX = 400; // จุดศูนย์กลางจอแกน X
            const offsetY = 450; // จุดศูนย์กลางจอแกน Y (ดันลงมาเพื่อให้เห็นความสูง)

            // คณิตศาสตร์มุม 30 องศาสำหรับ Isometric
            const angle = Math.PI / 6; 
            
            // สูตรคำนวณการฉายภาพ 3 แกน ลงระนาบ 2 แกน
            const x2d = (vec3.x - vec3.z) * Math.cos(angle);
            const y2d = vec3.y + (vec3.x + vec3.z) * Math.sin(angle);

            return {
                x: (x2d * scale) + offsetX,
                y: (-y2d * scale) + offsetY // ใส่ลบให้ Y เพราะพิกัดหน้าจอมันกลับหัว
            };
        }

        // =========================================================
        // ✒️ STEP 3: อัลกอริทึมจำลองลายเส้นสถาปนิก (Procedural Sketch)
        // =========================================================
        function drawArchitectLine(p1, p2, isBold = false) {
            ctx.beginPath();
            
            // 3.1 การตวัดเส้นทะลุจุดปลาย (Overshoot Algorithm)
            // คำนวณหาทิศทางของเส้น แล้วลากทะลุไปอีกนิดหน่อย (ประมาณ 5-15 พิกเซล)
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const overX = (dx / length) * (Math.random() * 10 + 5); 
            const overY = (dy / length) * (Math.random() * 10 + 5);

            // จุดเริ่มต้นที่ถอยหลังไปนิดหน่อย และจุดจบที่เลยไปนิดหน่อย
            const startX = p1.x - (overX * 0.5);
            const startY = p1.y - (overY * 0.5);
            const endX = p2.x + overX;
            const endY = p2.y + overY;

            ctx.moveTo(startX, startY);

            // 3.2 ความสั่นของมือ (Jitter Algorithm)
            // หั่นเส้นตรงเป็นท่อนๆ แล้วสุ่มให้พิกัดเบี้ยวเล็กน้อย
            const segments = 10;
            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const currentX = startX + (endX - startX) * t;
                const currentY = startY + (endY - startY) * t;
                
                // สุ่มให้เบี้ยวออกนอกเส้นทาง +- 0.5 พิกเซล
                const jitterX = currentX + (Math.random() - 0.5) * 1.5;
                const jitterY = currentY + (Math.random() - 0.5) * 1.5;
                
                ctx.lineTo(jitterX, jitterY);
            }

            // ตั้งค่าหัวปากกา
            ctx.strokeStyle = isBold ? '#1a1a1a' : '#4a4a4a';
            ctx.lineWidth = isBold ? 1.2 : 0.6;
            ctx.stroke();

            // 3.3 ลากย้ำเส้นอีกรอบให้ดูเหมือนฝนดินสอ/ปากกาซ้ำ
            if (isBold) {
                ctx.beginPath();
                ctx.moveTo(startX + Math.random(), startY + Math.random());
                ctx.lineTo(endX + Math.random(), endY + Math.random());
                ctx.strokeStyle = 'rgba(0,0,0,0.4)';
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }

        // =========================================================
        // 🚀 รันระบบ: สร้างฐานรากวิหารแก้วด้วยคณิตศาสตร์
        // =========================================================
        function renderScene() {
            // สร้างพิกัดโครงสร้างฐานราก (BIM Foundation Nodes)
            const width = 120;
            const depth = 200;
            const height = 20;

            // จุด 4 มุมของฐานล่าง (Y = 0)
            const p1 = project(new Vector3(-width, 0, -depth));
            const p2 = project(new Vector3(width, 0, -depth));
            const p3 = project(new Vector3(width, 0, depth));
            const p4 = project(new Vector3(-width, 0, depth));

            // จุด 4 มุมของฐานบน (Y = height)
            const t1 = project(new Vector3(-width, height, -depth));
            const t2 = project(new Vector3(width, height, -depth));
            const t3 = project(new Vector3(width, height, depth));
            const t4 = project(new Vector3(-width, height, depth));

            // วาดเส้นฐานรากด้วยฟังก์ชันลายเส้นสถาปนิก
            // เส้นตั้ง (เสาฐาน)
            drawArchitectLine(p1, t1, true);
            drawArchitectLine(p2, t2, true);
            drawArchitectLine(p3, t3, true);
            drawArchitectLine(p4, t4, true);

            // เส้นขอบล่าง
            drawArchitectLine(p1, p2, false);
            drawArchitectLine(p2, p3, false);
            drawArchitectLine(p3, p4, false);
            drawArchitectLine(p4, p1, false);

            // เส้นขอบบน
            drawArchitectLine(t1, t2, true);
            drawArchitectLine(t2, t3, true);
            drawArchitectLine(t3, t4, true);
            drawArchitectLine(t4, t1, true);
            
            // วาดเส้นแกนนำสายตา (Grid/Guidelines) เบาๆ
            drawArchitectLine(project(new Vector3(-300, 0, 0)), project(new Vector3(300, 0, 0)), false);
            drawArchitectLine(project(new Vector3(0, 0, -300)), project(new Vector3(0, 0, 300)), false);
        }

        // สั่งทำงาน
        renderScene();
    </script>
</body>
</html>
