<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วิหารแก้ว วัดท่าซุง - Architectural Sketchbook Masterpiece</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #262626; color: #111; }
        
        /* กระดาษสมุดสเก็ตช์ */
        .sketchbook-page {
            background-color: #fdfcf7;
            background-image: radial-gradient(#e5e2d6 1px, transparent 1px);
            background-size: 25px 25px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6), inset 0 0 80px rgba(229, 226, 214, 0.4);
        }

        /* ลายเส้นปากกาหมึกซึมแบบดิบๆ */
        .ink-bold { stroke: #1a1a1a; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .ink-fine { stroke: #333333; stroke-width: 0.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .ink-hatch { stroke: #555555; stroke-width: 0.5; fill: none; stroke-linecap: round; }
        
        /* รอยปากกาแดงสำหรับเขียนกำกับ (Hotspots) */
        .ink-red { stroke: #a32a2a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
        .text-red { fill: #a32a2a; font-family: 'Sarabun', sans-serif; font-weight: bold; font-size: 14px; }

        /* สันห่วงสมุดสปริงด้านบน */
        .spiral-binding {
            display: flex;
            justify-content: space-around;
            width: 92%;
            margin: 0 auto;
            position: absolute;
            top: -16px;
            left: 4%;
            z-index: 20;
        }
        .spiral-ring {
            width: 16px;
            height: 34px;
            background: linear-gradient(135deg, #71717a 0%, #18181b 50%, #a1a1aa 100%);
            border-radius: 8px;
            box-shadow: 0 5px 8px rgba(0,0,0,0.4);
        }

        /* โซนที่กดได้ (Interactive) */
        .hotspot-zone {
            cursor: pointer;
            transition: all 0.2s;
        }
        .hotspot-zone:hover .ink-red, .hotspot-zone.active .ink-red {
            stroke: #d97706; /* เปลี่ยนเป็นสีทองแดงเมื่อชี้ */
            stroke-width: 2.5;
        }
        .hotspot-zone:hover .text-red, .hotspot-zone.active .text-red {
            fill: #d97706;
        }
        
        .architect-font { font-family: 'Sarabun', sans-serif; font-style: italic; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 md:p-8">

    <main class="max-w-5xl w-full flex flex-col items-center relative">
        
        <!-- สมุดสเก็ตช์หลัก -->
        <div class="sketchbook-page w-full max-w-3xl rounded-lg p-6 md:p-10 relative mt-8">
            
            <!-- สันห่วงสปริงแบบสมุดสเก็ตช์จริง -->
            <div class="spiral-binding">
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
                <div class="spiral-ring"></div><div class="spiral-ring"></div><div class="spiral-ring"></div>
            </div>

            <!-- ปากกาสถาปนิกวางพาด -->
            <div class="absolute -top-10 right-10 z-30 transform rotate-[15deg] hidden md:block pointer-events-none drop-shadow-2xl">
                <div class="bg-zinc-900 text-zinc-300 px-10 py-2.5 rounded-full text-[10px] font-bold border-b-4 border-zinc-950 flex items-center gap-2">
                    <span class="text-amber-500">✒️</span> ARCHITECT PEN - 0.5
                </div>
            </div>

            <!-- ข้อความกำกับหัวกระดาษแบบเขียนมือ -->
            <div class="text-right mb-4">
                <div class="architect-font text-xs text-zinc-600 font-bold uppercase">Project: Glass Cathedral 100M (High Angle)</div>
                <div class="architect-font text-[10px] text-zinc-500">Sketched by Chang Bird / Bodhi-Panya v9.0</div>
            </div>

            <!-- SVG ลายเส้นสถาปัตยกรรมมุมสูงดิบๆ (Messy Isometric Bird-Eye View) -->
            <svg viewBox="0 0 1000 650" class="w-full h-auto">
                
                <!-- เส้นตีเปอร์สเปกติฟร่างๆ (Perspective Guidelines) -->
                <path d="M 0 350 L 1000 350 M 500 0 L 500 700" class="ink-hatch" stroke-dasharray="5 15" opacity="0.4" />
                <path d="M 100 100 L 900 600 M 100 600 L 900 100" class="ink-hatch" opacity="0.2" />

                <!-- ฐานวิหาร (Overshoot เส้นทะลุขอบ) -->
                <path d="M 140 480 L 500 600 L 860 480 Z" class="ink-bold" />
                <path d="M 120 485 L 510 615 L 880 485" class="ink-fine" /> <!-- เส้นตวัดเกิน -->
                <path d="M 150 480 L 150 510 M 500 600 L 500 630 M 850 480 L 850 510" class="ink-fine" />
                <path d="M 130 500 L 500 620 L 870 500" class="ink-bold" />

                <!-- โครงหลังคาชั้น 1 (Roof Tier 1) -->
                <path d="M 100 380 L 500 230 L 900 380 L 500 510 Z" class="ink-bold" />
                <path d="M 80 385 L 515 220 L 920 385 L 515 525 Z" class="ink-fine" /> <!-- เส้นร่างซ้อน -->
                
                <!-- โครงหลังคาชั้น 2 -->
                <path d="M 200 290 L 500 170 L 800 290 L 500 400 Z" class="ink-bold" />
                <path d="M 180 295 L 510 160 L 820 295 L 510 415 Z" class="ink-fine" />
                
                <!-- โครงหลังคาชั้น 3 -->
                <path d="M 300 210 L 500 120 L 700 210 L 500 290 Z" class="ink-bold" />
                <path d="M 280 215 L 510 110 L 720 215 L 510 300 Z" class="ink-fine" />

                <!-- เสาโครงสร้างบีมแก้ว (Pillars) เขียนแบบเหลื่อมๆ -->
                <path d="M 250 420 L 250 480 M 245 422 L 245 482" class="ink-fine" />
                <path d="M 350 450 L 350 520 M 345 452 L 345 522" class="ink-fine" />
                <path d="M 450 480 L 450 550 M 445 482 L 445 552" class="ink-bold" />
                <path d="M 550 480 L 550 550 M 555 482 L 555 552" class="ink-bold" />
                <path d="M 650 450 L 650 520 M 655 452 L 655 522" class="ink-fine" />
                <path d="M 750 420 L 750 480 M 755 422 L 755 482" class="ink-fine" />

                <!-- แรเงาใต้หลังคาและฐาน (Architectural Hatching) -->
                <path d="M 200 395 L 230 375 M 220 405 L 250 385 M 240 415 L 270 395" class="ink-hatch" />
                <path d="M 770 375 L 800 395 M 750 385 L 780 405 M 730 395 L 760 415" class="ink-hatch" />
                <path d="M 480 605 L 480 625 M 490 608 L 490 628 M 510 608 L 510 628 M 520 605 L 520 625" class="ink-hatch" />

                <!-- ยอดฉัตร 7 ชั้น (มุมสูง) -->
                <path d="M 500 120 L 500 10 M 496 120 L 496 10" class="ink-bold" />
                <path d="M 460 90 L 540 90 M 465 80 L 535 80 M 470 70 L 530 70 M 475 60 L 525 60 M 480 50 L 520 50 M 485 40 L 515 40 M 490 30 L 510 30" class="ink-bold" />
                <path d="M 450 93 L 550 93 M 455 83 L 545 83" class="ink-fine" /> <!-- เส้นตวัดรกๆ ที่ยอดฉัตร -->

                <!-- ================= HOTSPOTS แบบรอยปากกาแดง ================= -->
                <!-- 1. ยอดฉัตร -->
                <g class="hotspot-zone" onclick="showBIM('chattra')">
                    <circle cx="500" cy="50" r="45" class="ink-red" />
                    <text x="560" y="55" class="text-red">1. ยอดฉัตร</text>
                    <path d="M 545 50 L 555 50" class="ink-red" />
                </g>

                <!-- 2. หลังคาซ้อนชั้น -->
                <g class="hotspot-zone" onclick="showBIM('roof')">
                    <circle cx="350" cy="200" r="40" class="ink-red" />
                    <text x="210" y="205" class="text-red">2. หลังคาทรงไทย</text>
                    <path d="M 310 200 L 290 200" class="ink-red" />
                </g>

                <!-- 3. เสาและโถง -->
                <g class="hotspot-zone" onclick="showBIM('pillars')">
                    <circle cx="650" cy="490" r="35" class="ink-red" />
                    <text x="700" y="495" class="text-red">3. โครงสร้างเสา</text>
                    <path d="M 685 490 L 695 490" class="ink-red" />
                </g>

            </svg>

            <!-- ลายเซ็นและข้อความด้านล่าง -->
            <div class="mt-8 pt-4 border-t border-zinc-300 flex justify-between items-end">
                <div class="architect-font text-xs text-zinc-600 font-bold">
                    วิหารแก้ว 100 เมตร (Isometric Sketch View)<br>
                    <span class="text-amber-700">"สัมปติจฉามิ"</span>
                </div>
                <div class="font-signature text-2xl text-zinc-800 font-bold italic pr-4">ช่างเบิร์ด</div>
            </div>

        </div>

        <!-- แผงแสดงข้อมูล BIM สไตล์กระดาษโน้ตแนบ -->
        <div id="bim-panel" class="w-full max-w-3xl bg-[#fffdf5] border-l-4 border-amber-600 shadow-lg p-5 mt-6 rounded hidden transition-all">
            <h3 id="bim-title" class="text-lg font-bold text-zinc-900 mb-2 font-serif">หัวข้อ</h3>
            <p id="bim-desc" class="text-sm text-zinc-700 leading-relaxed architect-font">รายละเอียด...</p>
        </div>

    </main>

    <script>
        const bimData = {
            chattra: {
                title: "✨ 1. ยอดฉัตร 7 ชั้น (The 7-Tiered Chattra)",
                desc: "จุดศูนย์รวมพลังงานและสิริมงคล มองจากมุมสูง (Bird-Eye View) จะเห็นสัดส่วนการลดหลั่นของชั้นฉัตรที่สมบูรณ์แบบตามหลัก Golden Ratio (1.618)"
            },
            roof: {
                title: "🏛️ 2. โครงสร้างหลังคาซ้อนชั้น (Thai Applied Roof Structure)",
                desc: "เส้นสายสเก็ตช์ที่ซ้อนทับกัน (Overlapping strokes) แสดงให้เห็นถึงความซับซ้อนของโครงหลังคาที่ครอบคลุมพื้นที่วิหาร 100 เมตร"
            },
            pillars: {
                title: "📐 3. แนวเสาบีมและโถงแก้ว (Glass Hall & Pillars)",
                desc: "โครงสร้างเสาที่เรียงรายรับน้ำหนักหลังคา ลายเส้นแรเงา (Hatching) ช่วยขับเน้นมิติความลึกของโถงวิหารด้านล่าง"
            }
        };

        function showBIM(key) {
            // อัปเดตข้อมูล
            document.getElementById('bim-title').innerText = bimData[key].title;
            document.getElementById('bim-desc').innerText = bimData[key].desc;
            
            // แสดงผลแผงข้อมูล
            const panel = document.getElementById('bim-panel');
            panel.classList.remove('hidden');
            
            // จัดการคลาส active
            document.querySelectorAll('.hotspot-zone').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
